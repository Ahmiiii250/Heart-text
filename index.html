<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Heart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #050505;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas#particles {
    display: block;
    width: 100%;
    max-width: 640px;
    height: 46vh;
  }
  .input-wrap {
    width: 84%;
    max-width: 460px;
    margin-top: 4vh;
  }
  #box {
    width: 100%;
    height: 52px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(80,85,64,0.55), rgba(45,48,36,0.55));
    border: 1px solid rgba(180,180,150,0.25);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3) inset, 0 8px 24px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 22px;
    backdrop-filter: blur(2px);
  }
  #textInput {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    color: #f2efe2;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
    caret-color: #ffb199;
  }
  #textInput::placeholder {
    color: rgba(230,225,205,0.35);
    font-weight: 500;
  }
  #musicBtn {
    position: absolute;
    top: 22px;
    right: 22px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ffb199;
    transition: background 0.2s ease;
  }
  #musicBtn:hover { background: rgba(255,255,255,0.12); }
  #musicBtn svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<div id="stage">
  <button id="musicBtn" title="Play music">
    <svg viewBox="0 0 24 24" fill="currentColor" id="musicIconOn" style="display:none;">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="musicIconOff">
      <path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="3" y1="3" x2="21" y2="21" stroke-linecap="round"/>
    </svg>
  </button>
  <canvas id="particles"></canvas>
  <div class="input-wrap">
    <div id="box">
      <input id="textInput" type="text" placeholder="Type something..." autocomplete="off" spellcheck="false" />
    </div>
  </div>
  <audio id="bgm" loop preload="auto" src="upload/music.mp3"></audio>
</div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
const input = document.getElementById('textInput');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildTargets(currentText);
}
window.addEventListener('resize', resize);

// ---------- offscreen sampler ----------
const off = document.createElement('canvas');
const offCtx = off.getContext('2d', { willReadFrequently: true });

function sampleHeart(count) {
  off.width = W; off.height = H;
  offCtx.clearRect(0, 0, W, H);
  offCtx.fillStyle = '#fff';

  const cx = W / 2, cy = H / 2 - H * 0.03;
  const scale = Math.min(W, H) * 0.021;

  offCtx.beginPath();
  const steps = 200;
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    const px = cx + x * scale;
    const py = cy + y * scale;
    if (i === 0) offCtx.moveTo(px, py); else offCtx.lineTo(px, py);
  }
  offCtx.closePath();
  offCtx.fill();

  return pickPoints(count);
}

function sampleText(text, count) {
  off.width = W; off.height = H;
  offCtx.clearRect(0, 0, W, H);
  offCtx.fillStyle = '#fff';
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';

  let fontSize = H * 0.32;
  offCtx.font = `800 ${fontSize}px Arial, sans-serif`;
  let width = offCtx.measureText(text).width;
  const maxWidth = W * 0.92;
  if (width > maxWidth) {
    fontSize *= maxWidth / width;
    offCtx.font = `800 ${fontSize}px Arial, sans-serif`;
  }
  offCtx.fillText(text, W / 2, H / 2 - H * 0.03);
  return pickPoints(count);
}

function pickPoints(count) {
  const img = offCtx.getImageData(0, 0, W, H).data;
  const pts = [];
  const step = 2; // sampling grid resolution
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const idx = (y * W + x) * 4 + 3;
      if (img[idx] > 100) pts.push([x, y]);
    }
  }
  // shuffle
  for (let i = pts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pts[i], pts[j]] = [pts[j], pts[i]];
  }
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push(pts.length ? pts[i % pts.length] : [W/2, H/2]);
  }
  return out;
}

// ---------- particles ----------
let BASE_COUNT = 2800;
let particles = [];
let currentText = '';

function countForText(text) {
  if (!text || text.length === 0) return BASE_COUNT;
  // denser cloud for longer text so it stays readable & attractive
  return Math.min(9000, BASE_COUNT + text.length * 190);
}

function newParticle() {
  return {
    x: W/2 + (Math.random()-0.5) * W,
    y: H/2 + (Math.random()-0.5) * H,
    tx: W/2, ty: H/2,
    vx: 0, vy: 0,
    seed: Math.random() * 1000,
    size: Math.random() < 0.15 ? 1.6 : 0.9 + Math.random() * 0.7,
    hue: Math.random()
  };
}

function ensureParticleCount(count) {
  if (particles.length < count) {
    while (particles.length < count) particles.push(newParticle());
  } else if (particles.length > count) {
    particles.length = count;
  }
}

function buildTargets(text) {
  if (!W || !H) return;
  const count = countForText(text);
  ensureParticleCount(count);

  const targets = text && text.length > 0
    ? sampleText(text, count)
    : sampleHeart(count);

  for (let i = 0; i < count; i++) {
    const p = particles[i];
    const t = targets[i];
    p.tx = t[0];
    p.ty = t[1];
  }
}

// ---------- mouse / touch ripple (water-like distortion) ----------
const mouse = { x: -9999, y: -9999, active: false };
canvas.addEventListener('mousemove', (e) => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
  mouse.active = true;
});
canvas.addEventListener('mouseleave', () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });
canvas.addEventListener('touchmove', (e) => {
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  mouse.x = t.clientX - r.left;
  mouse.y = t.clientY - r.top;
  mouse.active = true;
}, { passive: true });
canvas.addEventListener('touchend', () => { mouse.active = false; mouse.x = -9999; mouse.y = -9999; });

const RIPPLE_RADIUS = 95;
const RIPPLE_STRENGTH = 5.2;
const SPRING = 0.22;      // higher = snaps back into shape faster
const DAMPING = 0.80;     // lower = more fluid / watery settle

let t0 = performance.now();
function animate(now) {
  t0 = now;
  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // spring force pulling back toward the shape (fast)
    const ax = (p.tx - p.x) * SPRING;
    const ay = (p.ty - p.y) * SPRING;
    p.vx = (p.vx + ax) * DAMPING;
    p.vy = (p.vy + ay) * DAMPING;

    // cursor / touch ripple — water-like push + wave ring
    if (mouse.active) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
      if (dist < RIPPLE_RADIUS) {
        const falloff = 1 - dist / RIPPLE_RADIUS;
        const wave = Math.sin(dist * 0.25 - now * 0.02) * 0.6;
        const force = (falloff * RIPPLE_STRENGTH) + wave * falloff;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
    }

    p.x += p.vx;
    p.y += p.vy;

    // ambient shimmer (fast dust flicker)
    const time = now * 0.0032 + p.seed;
    const jx = Math.sin(time) * 0.5;
    const jy = Math.cos(time * 1.3) * 0.5 - 0.15;

    const drawX = p.x + jx;
    const drawY = p.y + jy;

    // color: pink/red glow, brighter near core
    const flicker = 0.75 + Math.sin(time * 2.6) * 0.25;
    const r = 255;
    const g = Math.floor(60 + p.hue * 70);
    const b = Math.floor(90 + p.hue * 60);

    ctx.beginPath();
    ctx.fillStyle = `rgba(${r},${g},${b},${0.55 * flicker})`;
    ctx.shadowColor = `rgba(255,90,110,${0.8 * flicker})`;
    ctx.shadowBlur = 6;
    ctx.arc(drawX, drawY, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(animate);
}

input.addEventListener('input', () => {
  currentText = input.value.trim();
  buildTargets(currentText);
});

// ---------- background music ----------
// Audio file is loaded from the upload/ folder next to this HTML file.
// Put your track at: upload/music.mp3

const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
const iconOn = document.getElementById('musicIconOn');
const iconOff = document.getElementById('musicIconOff');
let musicPlaying = false;
let musicReady = false;

musicBtn.style.opacity = '0.35';
musicBtn.title = 'Loading music...';

bgm.addEventListener('canplaythrough', () => {
  musicReady = true;
  musicBtn.style.opacity = '1';
  musicBtn.title = 'Play music';
});
bgm.addEventListener('error', () => {
  musicReady = false;
  musicBtn.style.opacity = '0.35';
  musicBtn.title = 'Could not find upload/music.mp3';
});

musicBtn.addEventListener('click', () => {
  if (!musicReady) return;
  if (musicPlaying) {
    bgm.pause();
  } else {
    bgm.play().catch(() => {});
  }
  musicPlaying = !musicPlaying;
  iconOn.style.display = musicPlaying ? 'block' : 'none';
  iconOff.style.display = musicPlaying ? 'none' : 'block';
});

resize();
ensureParticleCount(BASE_COUNT);
buildTargets('');
requestAnimationFrame(animate);
</script>
</body>
</html>
